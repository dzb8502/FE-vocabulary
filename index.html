<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>FE Vocabulary</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.v15.css"></head><body>
<header><div><h1>FE Vocabulary</h1><p id="studyDay">Study plan not started</p><p id="countdown">Exam countdown</p></div><button id="settingsBtn" class="icon">⚙︎</button></header>
<main>
<section id="todayPanel" class="todayPanel"><b>Today</b><span id="todayProgress">Start the study plan when you are ready.</span></section><section class="dashboard"><div><b id="dueCount">0</b><span>Due</span></div><div><b id="learnedCount">0</b><span>Seen</span></div><div><b id="masteredCount">0</b><span>Strong</span></div></section>
<section class="modes"><button id="morningBtn" class="primary">Morning Session</button><button id="afternoonBtn">Afternoon Review</button><button id="browseBtn">Browse 1008</button></section>
<section id="session" class="hidden"><div class="sessionbar"><span id="sessionTitle"></span><span id="sessionProgress"></span></div><article id="card" class="card"><div class="meta"><span id="pool"></span><span id="domain"></span></div><h2 id="term"></h2><div class="pron"><span id="ipa"></span><span id="stress"></span><button id="speakBtn">🔊 0.75×</button></div><button id="revealBtn" class="reveal">Show meaning</button><div id="answer" class="answer hidden"><h3 id="zh"></h3><p id="connection"></p><div class="source" id="source"></div></div></article><div id="ratings" class="ratings hidden"></div><button id="endBtn" class="textbtn">End session</button></section>
<section id="browse" class="hidden"><input id="search" placeholder="Search English / 中文"><select id="filter"><option value="ALL">All pools</option><option>CORE_NOW</option><option>SUPPORT_NEXT</option><option>DEFER_OPTIONAL</option></select><div id="results"></div></section>
<div style="text-align:center;color:#9ca3af;font-size:10px;margin-top:12px">v1.5</div></main>
<dialog id="settings"><h2>Settings</h2><label>Speech speed <select id="rate"><option value="0.6">0.6×</option><option value="0.75" selected>0.75×</option><option value="0.9">0.9×</option><option value="1">1.0×</option></select></label><label>New words / morning <input id="newLimit" type="number" min="5" max="50" value="25"></label><div class="settingsActions"><button id="startPlanBtn">Start Study Plan</button><button id="exportBtn">Export progress</button><label class="import">Import progress<input id="importFile" type="file" accept="application/json"></label><button id="resetBtn">Reset progress</button></div><button id="closeSettings" class="primary">Done</button></dialog>
<script src="vocab.v15.js"></script><script src="app.v15.js"></script></body></html>
