<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="FE 听学"><meta name="theme-color" content="#11252e"><title>FE 通勤听学</title><style>
*{box-sizing:border-box}body{margin:0;background:#eff5f3;color:#11252e;font:17px system-ui,sans-serif}header{background:#11252e;color:white;padding:32px max(22px,calc((100% - 660px)/2)) 24px}h1{margin:5px 0}main{max-width:700px;margin:auto;padding:20px}section{background:white;border-radius:20px;padding:20px;margin-bottom:16px}label{display:block;margin-bottom:10px}button,select{font:inherit;min-height:48px;border:1px solid #b8ccc6;border-radius:10px;background:#fff;color:#11252e;padding:8px 12px}select{max-width:100%}button{cursor:pointer}#play{background:#006650;color:white;border:0;min-height:58px;font-weight:700}nav{display:grid;grid-template-columns:1fr 2fr 1fr;gap:8px}progress{width:100%;accent-color:#006650}#status{min-height:1.5em}p{line-height:1.6}.muted{color:#50676c;font-size:14px}details button{width:100%;text-align:left;margin-top:6px}button[aria-current=true]{background:#d9eee7;border-color:#006650}
</style></head><body><header><small>FE OTHER DISCIPLINES</small><h1>FE 通勤听学</h1><div>按章听讲 · 术语 · 回忆题</div></header><main><section><label>选择课程<br><select id="chapter"></select></label><label>播放语速 <select id="rate"><option value=".8">0.8×</option><option value=".95" selected>正常</option><option value="1.1">1.1×</option></select></label><progress id="bar"></progress><h2 id="title"></h2><p id="status" role="status"></p><nav><button id="prev">上一节</button><button id="play">开始播放</button><button id="next">下一节</button></nav><p class="muted">每一章独立记住进度。续播从上次暂停的小段开头开始。出发前点播放；锁屏后是否继续取决于设备浏览器。</p></section><section><details><summary>本章目录</summary><div id="toc"></div></details></section><section><details><summary>当前小节讲稿与答案</summary><div id="script"></div></details></section></main><script>
const chapters=[{id:'1',title:'第1章 · 解析几何与三角学',sections:[["直线","Slope. Intercept. Point-slope form.","斜率是竖直变化量除以水平变化量。用同一个顺序取两个坐标差。水平线的斜率为零，竖直线的斜率未定义。求横截距就令纵坐标为零；求纵截距就令横坐标为零。","经过原点和点二、六的直线，斜率是多少？","三。纵坐标变化六，横坐标变化二。"],["多项式函数","Polynomial. Quadratic. Root. Repeated root.","最高次非零项决定多项式的次数。次数为二的叫二次函数。令函数为零来求根。二次方程的判别式是 b 的平方减四 a c。正值有两个不同实根，零有重实根，负值没有实根。","二次函数图像与横轴相切时，有几个不同的实根？","一个；它是重根。"],["圆锥曲线","Conic section. Circle. Parabola. Ellipse. Hyperbola. Focus. Foci. Directrix.","圆上各点到圆心等距。抛物线上各点到焦点和准线等距。椭圆到两个焦点的距离和固定，双曲线到两个焦点的距离差的绝对值固定。","标准式里，椭圆和双曲线的两个平方项有什么区别？","椭圆的两项相加；双曲线的两项相减。对无旋转的双曲线，右边化成正一后，正项决定开口方向。"],["球面","Sphere. Center. Radius.","球面是到球心距离等于半径的所有空间点。标准方程左边是三个坐标相对球心的差各自平方再相加，右边是半径平方。","球面标准方程右边是二十五，半径是多少？","五。"],["空间两点距离","Distance between two points in space. Coordinate difference.","分别取两个点的横坐标差、纵坐标差和高度差。三个差各自平方，相加再开方。这个方法也用来求三维向量的长度。","三个坐标差分别是三、四、十二，距离是多少？","十三。"],["度与弧度","Degree. Radian. Angle mode.","一百八十度等于派弧度。度转弧度乘以派除以一百八十；弧度转度做反向换算。用计算器求三角函数之前先检查角度模式。","六十度等于多少弧度？","派除以三。"],["平面角","Plane angle. Complementary. Supplementary.","两个角相加等于九十度，叫互余；相加等于一百八十度，叫互补。量角时先确定始边、终边和旋转方向；按通常坐标约定，逆时针为正。","四十度的补角是多少？","一百四十度。"],["三角形","Triangle. Interior angle. Isosceles. Equilateral.","平面三角形三个内角和为一百八十度。等腰三角形的两条等边所对的角相等；等边三角形的三个角都是六十度。三角形任意两边之和必须大于第三边。","长二、三、五的三条线段能组成三角形吗？","不能。二加三等于五，三条线段只能排成直线。"],["直角三角形","Right triangle. Opposite. Adjacent. Hypotenuse.","相对于选定的锐角，正弦是对边除以斜边；余弦是邻边除以斜边；正切是对边除以邻边。换一个锐角，对边和邻边会互换，斜边不变。","对边三、邻边四，正切是多少？","四分之三。"],["三角恒等式","Trigonometric identity. Pythagorean identity.","正弦平方加余弦平方恒等于一。余弦在正负同一个角时相等；正弦则变号。如果从平方求出绝对值，还得用象限确定正负。","一个角在第二象限，正弦为五分之三，余弦是多少？","负五分之四。第二象限横坐标为负。"],["一般三角形","Law of sines. Law of cosines. Included angle.","知道一组相对的边和角，可以考虑正弦定理。知道两边和夹角求第三边，或知道三边求一个角，考虑余弦定理。若只给两边和其中一条边的对角，要注意可能有两个解，也可能无解。","两边长度分别为三和四，夹角为九十度。第三边是多少？","五。余弦定理在夹角九十度时变成熟悉的勾股定理。"],["面积计算","Area. Perpendicular height. Sector. Composite area.","三角形面积是底乘垂直高的一半。平行四边形是底乘垂直高。梯形是两条平行边的平均长度乘垂直高度。扇形面积是整圆面积乘圆心角占一整圈的比例。组合图形可以分块相加，或用大图减去孔洞。面积单位要平方。","半径四的圆上，九十度扇形的面积是多少？","四派平方单位。它占整个圆的四分之一。"],["体积计算","Volume. Cross-sectional area. Cylinder. Cone. Pyramid. Sphere.","直棱柱和圆柱的体积是底面积乘垂直高度。圆锥和棱锥是同底同高柱体的三分之一。球体体积和半径的三次方成正比。组合容器先按形状分段，再看哪些体积要加、哪些要减。体积单位要立方。","同底同高的圆柱和圆锥，哪个体积大，大几倍？","圆柱是圆锥的三倍。"]]}];
const $=id=>document.getElementById(id), synth=window.speechSynthesis, key='fe_commute_position_v1';
let saved={};try{saved=JSON.parse(localStorage.getItem(key))||{}}catch{}
let ch=0, i=0, playing=false, epoch=0, utterance, timer, watchdog;
const sections=()=>chapters[ch].sections, parts=()=>sections().flatMap(([n,en,zh,q,a])=>[['zh-CN',n],['en-US',en],['zh-CN',zh],['zh-CN',q],['pause',''],['zh-CN','答案。'+a]]);
function save(){saved[chapters[ch].id]=i;saved.current=chapters[ch].id;saved.rate=$('rate').value;try{localStorage.setItem(key,JSON.stringify(saved))}catch{}}
function draw(msg){const total=parts().length,k=Math.min(Math.floor(i/6),sections().length-1),s=sections()[k];$('title').textContent=(k+1)+' / '+sections().length+' · '+s[0];$('bar').max=total;$('bar').value=i;$('play').textContent=playing?'暂停':i===total?'重听本章':i?'继续播放':'开始播放';$('status').textContent=msg??(playing?'正在播放':i===total?'本章已听完':i?'已保存进度':'');$('toc').querySelectorAll('button').forEach((b,j)=>b.setAttribute('aria-current',String(j===k)));$('script').replaceChildren(...s.slice(1).map(t=>{const p=document.createElement('p');p.textContent=t;return p}));}
function stop(){playing=false;epoch++;clearTimeout(timer);clearTimeout(watchdog);if(utterance){utterance=null;synth?.cancel()}save();}
function step(){if(!playing)return;save();draw();const part=parts()[i];if(!part){stop();draw();return;}const token=epoch;const done=()=>{if(token!==epoch||!playing)return;clearTimeout(watchdog);utterance=null;i++;step()};if(part[0]==='pause'){timer=setTimeout(done,4000);return;}
try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch{}
const u=new SpeechSynthesisUtterance(part[1]);utterance=u;u.lang=part[0];u.rate=Number($('rate').value);u.onend=done;u.onerror=()=>{if(token!==epoch)return;stop();draw('未能播放。请检查声音输出，再点继续。')};watchdog=setTimeout(()=>{if(token!==epoch)return;stop();draw('朗读没有响应，请点继续重试。')},45000);try{synth.speak(u)}catch{stop();draw('无法启动朗读。')}
}
function start(){if(!synth||!window.SpeechSynthesisUtterance){draw('当前浏览器不支持朗读。可以打开讲稿阅读。');return;}if(i>=parts().length)i=0;playing=true;step();}
function seek(n){const was=playing;stop();i=Math.max(0,Math.min(n,(sections().length-1)*6));save();if(was)start();else draw();}
function load(){const raw=saved[chapters[ch].id];i=Number.isInteger(raw)?Math.max(0,Math.min(raw,parts().length)):0;$('toc').replaceChildren(...sections().map(([n],j)=>{const b=document.createElement('button');b.textContent=(j+1)+'. '+n;b.onclick=()=>seek(j*6);return b}));draw();}
chapters.forEach((c,j)=>$('chapter').add(new Option(c.title,j)));
ch=Math.max(0,chapters.findIndex(c=>c.id===saved.current));$('chapter').value=ch;if(['.8','.95','1.1'].includes(saved.rate))$('rate').value=saved.rate;
$('chapter').onchange=()=>{stop();ch=Number($('chapter').value);load();save()};$('rate').onchange=save;
$('play').onclick=()=>{if(playing){stop();draw()}else start()};$('prev').onclick=()=>seek((Math.floor(i/6)-1)*6);$('next').onclick=()=>{const n=(Math.floor(i/6)+1)*6;if(n<parts().length)seek(n)};
window.addEventListener('pagehide',stop);load();
</script></body></html>
